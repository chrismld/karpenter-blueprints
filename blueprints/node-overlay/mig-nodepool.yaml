# NodePool for MIG-partitioned GPU workloads.
#
# Division of knowledge: the POD expresses intent (gpu-sharing: mig), and
# this pool owns the hardware knowledge (which GPU models support MIG).
# Karpenter has no "MIG-capable" label, so the pool pins the closed list of
# MIG-capable models. This list changes roughly once per GPU generation;
# workloads never need to know it, and never require NodePool changes.
#
# The instance-gpu-name requirement also makes the pool safe by
# construction: a pod asking for MIG isolation can never land on a GPU
# that silently cannot partition (T4, A10G, L4, L40S are not MIG-capable).
# Every model listed here has a matching entry in the NodeClass MIG
# profile map, so every node from this pool boots partitioned.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-mig
spec:
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
  limits:
    nvidia.com/gpu: 32  # one 8-GPU instance at 4 partitions per GPU
  template:
    metadata:
      labels:
        intent: gpu-workloads
        gpu-sharing: mig
    spec:
      expireAfter: 720h
      nodeClassRef:
        group: karpenter.k8s.aws
        name: gpu-bottlerocket-mig
        kind: EC2NodeClass
      requirements:
        # Restrict to ["on-demand"] if your workload cannot tolerate
        # spot interruption.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-gpu-manufacturer
          operator: In
          values: ["nvidia"]
        # MIG-capable GPU models with verified Bottlerocket profile support.
        # (B200-class GPUs also support MIG but need an explicit profile
        # string in the NodeClass; add both together when you validate one.)
        - key: karpenter.k8s.aws/instance-gpu-name
          operator: In
          values: ["a100", "h100", "h200"]
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
